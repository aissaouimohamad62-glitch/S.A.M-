<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign System | AI Sovereign Advisor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sys-cyan: #00f0ff;
            --sys-cyan-glow: rgba(0, 240, 255, 0.4);
            --sys-purple: #9d4edd;
            --sys-purple-glow: rgba(157, 78, 221, 0.3);
            --sys-bg-dark: #02040a;
            --sys-panel: rgba(5, 10, 25, 0.85);
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--sys-bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, var(--sys-cyan-glow) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, var(--sys-purple-glow) 0%, transparent 25%);
            background-attachment: fixed;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .sys-font { font-family: 'Rajdhani', sans-serif; letter-spacing: 0.05em; }
        .glow-text { text-shadow: 0 0 5px var(--sys-cyan-glow), 0 0 10px var(--sys-cyan-glow); }
        .glow-text-purple { text-shadow: 0 0 5px var(--sys-purple-glow), 0 0 10px var(--sys-purple-glow); }
        .sys-pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 10px var(--sys-cyan); }
            50% { box-shadow: 0 0 20px var(--sys-cyan); }
            100% { box-shadow: 0 0 10px var(--sys-cyan); }
        }
        .sl-panel {
            background: var(--sys-panel);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15), inset 0 0 15px rgba(0, 240, 255, 0.1);
        }
        @keyframes systemPopIn {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); filter: brightness(2); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1); }
        }
        .animate-system-pop { animation: systemPopIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        
        /* Typewriter cursor effect */
        .typing-cursor::after {
            content: '|';
            animation: blink 1s infinite;
            color: var(--sys-cyan);
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .message-enter {
            animation: slideIn 0.3s ease-out forwards;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--sys-cyan); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-6">
    <nav class="max-w-4xl w-full mx-auto mb-4 p-2 bg-slate-900/40 backdrop-blur border border-slate-800 rounded-lg flex flex-wrap justify-center gap-2">

    <a href="schedule.html" class="px-3 py-1.5 text-xs bg-slate-800 border border-slate-700 hover:border-[var(--sys-cyan)] text-white rounded transition sys-font font-bold uppercase">👑 الحالة</a>
    <a href="dungeons.html" class="px-3 py-1.5 text-xs bg-slate-800 border border-slate-700 hover:border-red-500 text-white rounded transition sys-font font-bold uppercase">🧠 الزنازين</a>
    <a href="monarch-ai.html" class="px-3 py-1.5 text-xs bg-[var(--sys-purple)]/10 border border-[var(--sys-purple)] text-[var(--sys-purple)] rounded transition sys-font font-bold uppercase">🤖 المستشار</a>
    <a href="system-logs.html" class="px-3 py-1.5 text-xs bg-slate-800 border border-slate-700 hover:border-slate-400 text-white rounded transition sys-font font-bold uppercase">📂 السجلات</a>
</nav>

    <header class="max-w-4xl w-full mx-auto p-4 bg-slate-900/40 backdrop-blur border border-slate-800 rounded-xl flex flex-col sm:flex-row justify-between items-center gap-4 mb-4 animate-system-pop">
        <div class="flex items-center gap-3">
            <div id="status-indicator" class="w-3 h-3 rounded-full bg-[var(--sys-cyan)] sys-pulse shadow-[0_0_10px_var(--sys-cyan)]"></div>
            <div>
                <h1 class="text-md font-black tracking-wider text-slate-100 uppercase sys-font">Sovereign AI Advisor</h1>
                <p id="system-subtitle" class="text-[11px] text-slate-400">النواة التحليلية لتقييم كفاءة العاهل وتوجيه المسارات</p>
            </div>
        </div>
        
        <div class="flex gap-4 bg-black/40 px-4 py-2 border border-slate-800 rounded-lg text-xs sys-font">
            <div>LEVEL: <span id="ai-player-level" class="text-[var(--sys-cyan)] font-bold">1</span></div>
            <div class="text-slate-700">|</div>
            <div>XP: <span id="ai-player-xp" class="text-emerald-400 font-bold">0</span></div>
            <div class="text-slate-700">|</div>
            <div>TIER: <span id="ai-player-tier" class="text-[var(--sys-purple)] font-bold">ALPHA</span></div>
        </div>
        <a href="index.html" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-300 transition">العودة للرئيسية</a>
    </header>

    <main class="max-w-4xl w-full mx-auto flex-1 sl-panel rounded-xl p-4 md:p-6 flex flex-col justify-between shadow-2xl min-h-[550px] animate-system-pop" style="animation-delay: 0.1s;">
        
        <div id="chatScreen" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4 max-h-[520px]">
            <!-- Messages will be injected here -->
        </div>

        <div class="relative mt-2">
            <input type="text" id="chatInput" placeholder="أدخل أمر النظام، استفسار برامجي، أو اطلب ميثاقك المحدث..." 
                   class="w-full bg-slate-950/80 border border-slate-800 focus:border-[var(--sys-cyan)] focus:ring-1 focus:ring-[var(--sys-cyan)] text-slate-100 placeholder-slate-500 rounded-xl px-4 py-3.5 pl-16 text-sm outline-none transition shadow-inner">
            <button onclick="SovereignAI.sendMessage()" 
                    class="absolute left-3 top-2.5 px-4 py-1.5 bg-[var(--sys-cyan)] hover:bg-cyan-400 text-black font-bold text-xs rounded-lg transition uppercase sys-font">
                Send
            </button>
        </div>
    </main>

    <footer class="text-center text-[10px] text-slate-600 mt-4 sys-font uppercase tracking-widest">
        Sovereign Core Intellect Layer Ver 9.0 | Autonomy Matrix Enabled
    </footer>

    <script>
        // ==========================================
// SOVEREIGN AI CHAT ENGINE
// ==========================================
const SovereignAI = {
    sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;
        
        // عرض رسالة المستخدم
        this.addMessage(text, 'user');
        input.value = '';
        
        // تحليل النص لمعرفة القطاع المطلوب
        let domain = 'general';
        if (text.includes('برمج') || text.includes('كود') || text.includes('تقني')) domain = 'tech';
        else if (text.includes('رياض') || text.includes('بدن') || text.includes('جري')) domain = 'fitness';
        else if (text.includes('قرآن') || text.includes('روح') || text.includes('شرع')) domain = 'spiritual';
        else if (text.includes('مال') || text.includes('يوتيوب') || text.includes('كتاب')) domain = 'monetization';
        
        // تأخير بسيط لمحاكاة التفكير ثم الرد
        setTimeout(() => {
            const response = generateSovereignResponse(domain);
            this.addMessage(response, 'ai');
        }, 500);
    },
    
    addMessage(text, sender) {
        const screen = document.getElementById('chatScreen');
        const div = document.createElement('div');
        div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} message-enter`;
        
        if (sender === 'user') {
            div.innerHTML = `<div class="bg-slate-800 text-white px-4 py-2 rounded-lg max-w-[80%] text-sm border border-slate-700">${text}</div>`;
        } else {
            div.innerHTML = `
            <div class="flex gap-3 max-w-[90%]">
                <div class="w-8 h-8 rounded-full bg-[var(--sys-cyan)]/20 border border-[var(--sys-cyan)] flex items-center justify-center flex-shrink-0 text-sm shadow-[0_0_10px_rgba(0,240,255,0.2)]">🤖</div>
                <div class="bg-slate-900/80 text-slate-200 px-4 py-3 rounded-lg text-sm border border-[var(--sys-cyan)]/30 shadow-[0_0_10px_rgba(0,240,255,0.05)] leading-relaxed">${text}</div>
            </div>`;
        }
        
        screen.appendChild(div);
        screen.scrollTop = screen.scrollHeight; // النزول التلقائي لأسفل المحادثة
    }
};

// تفعيل إرسال الرسالة عبر زر Enter
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('chatInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') SovereignAI.sendMessage();
    });
});
// ==========================================================
// محرك البرامج السيادية الديناميكي المعتمد على ميثاق العمليات (Ver 8.0)
// ==========================================================
const SovereignPrograms = {
    // جلب مستوى اللاعب الحالي من localStorage الخاص بالنظام
    getPlayerLevel() {
        try {
            const systemData = JSON.parse(localStorage.getItem('monarch_system_data'));
            return systemData ? (systemData.level || 1) : 1;
        } catch (e) {
            return 1;
        }
    },

    // 1. بروتوكول التناوب الروحي والشرعي
    getSpiritualProgram(level) {
        if (level >= 450) {
            return `⚡ <b>[البروتوكول الروحي - مستوى اللانهاية]:</b><br>
            • <b>نظام التناوب الروحي (05:00 - 06:00):</b> الأيام الفردية (تلاوة تدبرية + مراجعة وتثبيت الحفظ القديم)، الأيام الزوجية (حفظ جديد مكثف + تلاوة تدبرية). يوم الجمعة مخصص لقراءة سورة الكهف فقط (راحة ذهنية استراتيجية).<br>
            • <b>كتلة العلوم الشرعية (يوم الخميس):</b> التركيز المعرفي الكامل على دراسة التوحيد، كتاب رياض الصالحين، وضبط قواعد التجويد موازاة مع الاستماع والتدبر لتصحيح النبرة الصوتية.`;
        } else if (level >= 130) {
            return `🕌 <b>[المسار الروحي المتقدم]:</b><br>
            • <b>كتلة الاستيقاظ وبناء الحصانة (05:00):</b> صلاة الفجر في وقتها، أذكار الصباح، ورد التلاوة التدبرية الثابت.<br>
            • <b>التحسين الصوتي:</b> الاستماع للقرآن بتركيز لمدة ساعة لتحسين الأداء القرائي ونبرة الصوت الصوتية لقناة الحفظ.`;
        }
        return `🕋 <b>[المسار الروحي التأسيسي]:</b><br>
        • <b>الفترة الروحية (05:00 - 06:00):</b> صلاة الفجر + الأذكار + تلاوة الورد اليومي لبناء الانضباط الأساسي واستقرار المؤشرات النفسية.`;
    },

    // 2. هندسة البرمجيات وأكاديمية الذكاء الاصطناعي
    getTechProgram(level) {
        if (level >= 450) {
            return `🌌 <b>[أكاديمية السيادة البرمجية والذكاء الاصطناعي]:</b><br>
            • <b>التطوير العميق (06:00 - 08:30):</b> القيادة البرمجية الكاملة لـ <b>مشروع AiMoha</b> باستخدام بايثون وجافا سكريبت لتطوير البنية التحتية للنظام التفاعلي.<br>
            • <b>أكاديمية الـ AI المتقدمة (08:30 - 10:30):</b> دراسة خوارزميات التعلم الآلي (ML)، النماذج اللغوية الكبيرة (LLMs)، وتطبيق الأنماط الذكية.<br>
            • <b>دمج منطق الشطرنج:</b> دمج التفكير الاستراتيجي للشطرنج في كتابة السكربتات ومراقبة مستودعات الأكواد الحية لضمان كفاءة الأنظمة وتقليل الأخطاء البرمجية.`;
        } else if (level >= 71) {
            return `⚙️ <b>[الهندسة البرمجية المتقدمة]:</b><br>
            • <b>المعمل التطبيقي:</b> بناء معماريات نظم الويب المتكاملة، دراسة هياكل البيانات، وتحسين مهارات حل مشكلات المنطق المعقدة.<br>
            • <b>الإنماء اللغوي:</b> كتلة إتقان المصطلحات البرمجية باللغة الإنجليزية والمحاكاة الصوتية (Shadowing).`;
        }
        return `💻 <b>[المعمل البرمجي التأسيسي]:</b><br>
        • <b>منطق الويب الأساسي:</b> بناء واجهات المستخدم المتجاوبة باستخدام HTML، CSS، وجافا سكريبت وفهم كيفية إدارة حزم البيانات الأساسية.`;
    },

    // 3. الإعداد البدني، الفنون القتالية، والجري الانفجاري
    getFitnessProgram(level) {
        if (level >= 450) {
            return `⚔️ <b>[بروتوكول القتال الفائق والكتلة الهوائية الانفجارية]:</b><br>
            • <b>الفنون القتالية التكتيكية:</b> جلسات مكثفة لتدريبات الـ Muay Thai والـ Jiu-Jitsu (BJJ) لرفع كفاءة الالتحام والدفاع اللصيق.<br>
            • <b>بروتوكول الجري الانفجاري الفائق:</b> الالتزام الصارم بـ <b>8 ساعات أسبوعياً</b> من الجري (مقسمة إلى ساعة يومياً من الأحد للأربعاء، ساعة ونصف يوم الخميس، وساعة ونصف يوم السبت) لضمان أعلى معدلات التحمل الدوري التنفسي والاستشفاء العضلي.<br>
            • <b>كتلة بناء الـ Core الحركي:</b> التركيز على خمسة تمارين فائقة (Plank للاستقرار، Bicycle Crunches للجوانب، Leg Raises للبطن السفلي، Mountain Climbers لحرق الدهون، و Bird Dog للتوازن) لبناء درع عضلي صلب والوصول للياقة البدنية الفائقة.<br>
            • <b>الأداء الرياضي:</b> المشاركة في المباريات والبطولات الكاملة لكرة القدم وكرة السلة دون إجهاد مفرط.`;
        } else if (level >= 130) {
            return `🏋️‍♂️ <b>[بروتوكول الإعداد البدني ونظام PPL المتقدم]:</b><br>
            • <b>تقسيم المجموعات العضلية:</b> الالتزام بنظام Push / Pull / Legs مع دمج تمارين الكاليسثينكس لزيادة الثبات.<br>
            • <b>التمارين المهارية:</b> تدريبات جري مخصصة لرفع اللياقة اللاهوائية والتحكم في الكرة.`;
        }
        return `🏃‍♂️ <b>[اللياقة البدنية الأساسية]:</b><br>
        • <b>بناء القاعدة:</b> تمارين هوائية خفيفة وإطالات عضلية متوازنة مع التركيز على جودة الأداء والوضع الصحيح للحركة لتفادي الإصابات.`;
    },

    // 4. إمبراطورية المحتوى، الكتب الرقمية، والتسييل المالي
    getMonetizationProgram(level) {
        if (level >= 130) {
            return `💰 <b>[كتلة الإنتاج الفائق والسيادة المالية المستقلة]:</b><br>
            • <b>صناعة المحتوى المرئي لليوتيوب:</b> تصوير الفيديوهات، هندسة الصوت، وصياغة الخطافات النفسية القوية (Hooks) لإدارة وتطوير قنوات <b>Onyx Apex</b> وقناة <b>Reciter Aissaoui Mohammed</b>، مع تخصيص يوم الجمعة للتعديل البصري الاحترافي.<br>
            • <b>تسييل المعرفة والكتب الرقمية:</b> صياغة وتأليف الكتب الرقمية، تصميم الأصول المرئية، والتدقيق اللغوي النهائي لإنشاء مصادر دخل حر مستقلة وقابلة للبيع على المنصات الرقمية.`;
        }
        return `📚 <b>[مسار تسييل الدخل التأسيسي]:</b><br>
        • <b>تغذية العقل:</b> القراءة المكثفة في كتب تطوير الذات وبناء الأنظمة، مع تطبيق "ديتوكس الدوبامين" الصارم لتطهير المستقبلات العصبية وزيادة التركيز العميق.`;
    }
};

// الدالة الأساسية للمستشار لتوليد الردود وتحديث الأزرار الجانبية في الشاشة
function generateSovereignResponse(domain) {
    const currentLevel = SovereignPrograms.getPlayerLevel();
    let responseHtml = `<div class="border-b border-[var(--sys-cyan)] pb-2 mb-4">
        <span class="text-xs tracking-widest text-slate-400 font-mono">[SYSTEM ANALYSIS]</span>
        <h3 class="text-lg font-black text-[var(--sys-cyan)]">المستوى الحالي للنظام: LVL ${currentLevel}</h3>
    </div>`;

    switch(domain) {
        case 'spiritual':
            responseHtml += SovereignPrograms.getSpiritualProgram(currentLevel);
            break;
        case 'tech':
            responseHtml += SovereignPrograms.getTechProgram(currentLevel);
            break;
        case 'fitness':
            responseHtml += SovereignPrograms.getFitnessProgram(currentLevel);
            break;
        case 'monetization':
            responseHtml += SovereignPrograms.getMonetizationProgram(currentLevel);
            break;
        default:
            responseHtml += `[توجيه]: يرجى تحديد قطاع صالح لاستدعاء بروتوكوله الخاص بمستواك الحالي.`;
    }
    
    // إظهار رسالة اللانهاية التاريخية الكبرى إذا وصل اللاعب للمستوى 450 فما فوق
    if (currentLevel >= 450) {
        responseHtml += `<br><br>
        <div class="mt-4 p-3 bg-cyan-950/40 border border-[var(--sys-cyan)] rounded animate-pulse">
            <span class="text-xs font-mono text-[var(--sys-cyan)] block mb-1">📢 [STATUS: SOVEREIGN AUTONOMY ACTIVATED]</span>
            <p class="text-sm font-bold text-slate-200">الآن يمكنك تدبر أمورك بنفسك وقراراتك الآن. هذا هو التحسين الأخير للنظام.</p>
        </div>`;
    }
    
    return responseHtml;
}
    </script>

}
</script>
