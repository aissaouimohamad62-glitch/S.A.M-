<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign System | Brain Training Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sys-cyan: #00f0ff;
            --sys-cyan-glow: rgba(0, 240, 255, 0.4);
            --sys-purple: #9d4edd;
            --sys-purple-glow: rgba(157, 78, 221, 0.3);
            --sys-bg-dark: #02040a;
            --sys-panel: rgba(5, 10, 25, 0.85);
        }
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--sys-bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, var(--sys-cyan-glow) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, var(--sys-purple-glow) 0%, transparent 25%);
            background-attachment: fixed;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .sys-font { font-family: 'Rajdhani', sans-serif; letter-spacing: 0.05em; }
        .sl-panel {
            background: var(--sys-panel);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(157, 78, 221, 0.3);
            box-shadow: 0 0 25px rgba(157, 78, 221, 0.15), inset 0 0 15px rgba(157, 78, 221, 0.1);
            position: relative;
        }
        .sl-panel::before, .sl-panel::after {
            content: ''; position: absolute; width: 20px; height: 20px; pointer-events: none;
        }
        .sl-panel::before { top: -2px; left: -2px; border-top: 3px solid var(--sys-purple); border-left: 3px solid var(--sys-purple); }
        .sl-panel::after { bottom: -2px; right: -2px; border-bottom: 3px solid var(--sys-purple); border-right: 3px solid var(--sys-purple); }
        
        @keyframes systemPopIn {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); filter: brightness(2); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1); }
        }
        .animate-system-pop { animation: systemPopIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--sys-purple); }
    </style>
</head>
<body class="p-4 md:p-8">
    
    <nav class="max-w-4xl mx-auto mb-6 p-2 bg-slate-900/60 backdrop-blur border border-slate-800 rounded-lg flex flex-wrap justify-center gap-2 animate-system-pop">
        <a href="index.html" class="px-3 py-1.5 text-xs bg-slate-800 border border-slate-700 hover:border-[var(--sys-cyan)] text-white rounded transition sys-font font-bold uppercase">🏠 الرئيسية</a>
        <a href="schedule.html" class="px-3 py-1.5 text-xs bg-slate-800 border border-slate-700 hover:border-[var(--sys-cyan)] text-white rounded transition sys-font font-bold uppercase">👑 الحالة</a>
        <a href="dungeons.html" class="px-3 py-1.5 text-xs bg-slate-800 border border-slate-700 hover:border-red-500 text-white rounded transition sys-font font-bold uppercase">🧠 الزنازين</a>
        <a href="brain-stats.html" class="px-3 py-1.5 text-xs bg-[var(--sys-purple)]/10 border border-[var(--sys-purple)] text-[var(--sys-purple)] rounded transition sys-font font-bold uppercase">🧠 إحصائيات العقل</a>
        <a href="monarch-ai.html" class="px-3 py-1.5 text-xs bg-slate-800 border border-slate-700 hover:border-[var(--sys-cyan)] text-white rounded transition sys-font font-bold uppercase">🤖 المستشار</a>
        <a href="system-logs.html" class="px-3 py-1.5 text-xs bg-slate-800 border border-slate-700 hover:border-slate-400 text-white rounded transition sys-font font-bold uppercase">📂 السجلات</a>
    </nav>

    <header class="max-w-4xl mx-auto mb-8 p-4 bg-slate-900/60 backdrop-blur border border-slate-800 flex flex-col md:flex-row justify-between items-center rounded-lg animate-system-pop gap-4">
        <div class="flex items-center gap-4">
            <a href="index.html" class="text-xs bg-slate-800 px-3 py-2 border border-slate-700 hover:border-[var(--sys-purple)] transition text-white rounded">↩ العودة</a>
            <div>
                <h1 class="sys-font text-xl font-black tracking-widest text-[var(--sys-purple)] uppercase">🧠 Brain Training Analytics</h1>
                <p class="text-[10px] text-slate-400">تحليل الأداء المعرفي ومكاسب الذكاء السائل</p>
            </div>
        </div>
        <div class="flex items-center gap-6 sys-font">
            <div class="text-right">
                <span class="text-[10px] text-slate-400 block">INT STAT</span>
                <span id="header-int" class="text-xl font-bold text-[var(--sys-purple)]">10</span>
            </div>
            <div class="text-right">
                <span class="text-[10px] text-slate-400 block">LEVEL</span>
                <span id="header-level" class="text-xl font-bold text-[var(--sys-cyan)]">1</span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto animate-system-pop" style="animation-delay: 0.1s;">
        <div class="sl-panel p-6 rounded-xl">
            <div class="text-center mb-8 border-b border-[var(--sys-purple)]/30 pb-4">
                <div class="sys-font text-[var(--sys-purple)] tracking-[0.5em] text-sm mb-2 font-bold">COGNITIVE DOMINATION</div>
                <h2 class="text-3xl font-black text-white drop-shadow-[0_0_10px_var(--sys-purple)]">تحليلات التدريب الذهني</h2>
            </div>
            
            <div id="brainStatsContainer" class="space-y-6">
                </div>
        </div>
    </main>

    <script>
        // ==========================================
        // PLAYER STATE SYNC (التزامن المركزي)
        // ==========================================
        const PlayerState = {
            data: { level: 1, stats: { int: 10 } },
            
            init() {
                const saved = localStorage.getItem('monarch_system_data');
                if (saved) {
                    try { this.data = { ...this.data, ...JSON.parse(saved) }; } catch(e) {}
                }
                this.updateUI();
            },
            
            updateUI() {
                const intStat = this.data.stats?.int || 10;
                const levelStat = this.data.level || 1;
                
                if(document.getElementById('header-int')) document.getElementById('header-int').textContent = intStat;
                if(document.getElementById('header-level')) document.getElementById('header-level').textContent = levelStat;
            }
        };

        // ==========================================
        // BRAIN STATS RENDER ENGINE
        // ==========================================
        const BrainStats = {
            render() {
                const container = document.getElementById('brainStatsContainer');
                if(!container) return;
                
                // قراءة السجلات الخاصة بالزنازين لحساب المكاسب
                // قراءة السجلات المستقلة الخاصة بالزنازين فقط لمنع تأثرها بمسح السجلات العامة
const dungeonHistory = JSON.parse(localStorage.getItem('sovereign_dungeon_history') || '[]');
const totalDungeons = dungeonHistory.length;
// الحساب الدقيق لنقاط INT المكتسبة بناءً على البيانات المحفوظة، مع وضع 2 كقيمة افتراضية
const totalINT = dungeonHistory.reduce((sum, current) => sum + (current.int || 2), 0);

                container.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="bg-slate-900/80 p-6 border border-[var(--sys-cyan)]/30 rounded-lg text-center hover:border-[var(--sys-cyan)] transition-colors">
                            <div class="text-xs text-slate-400 sys-font mb-2 uppercase tracking-widest">Dungeons Cleared</div>
                            <div class="text-5xl font-black text-[var(--sys-cyan)] drop-shadow-[0_0_10px_var(--sys-cyan)]">${totalDungeons}</div>
                            <div class="text-[10px] text-slate-500 mt-2">إجمالي الزنازين المقهورة</div>
                        </div>
                        
                        <div class="bg-slate-900/80 p-6 border border-[var(--sys-purple)]/30 rounded-lg text-center hover:border-[var(--sys-purple)] transition-colors transform md:-translate-y-2">
                            <div class="text-xs text-slate-400 sys-font mb-2 uppercase tracking-widest">Current INT</div>
                            <div class="text-6xl font-black text-[var(--sys-purple)] drop-shadow-[0_0_15px_var(--sys-purple)]">${PlayerState.data.stats?.int || 10}</div>
                            <div class="text-[10px] text-[var(--sys-purple)] mt-2 font-bold tracking-widest">الذكاء السائل الحالي</div>
                        </div>

                        <div class="bg-slate-900/80 p-6 border border-emerald-500/30 rounded-lg text-center hover:border-emerald-500 transition-colors">
                            <div class="text-xs text-slate-400 sys-font mb-2 uppercase tracking-widest">INT Gained</div>
                            <div class="text-5xl font-black text-emerald-400 drop-shadow-[0_0_10px_rgba(16,185,129,0.5)]">+${totalINT}</div>
                            <div class="text-[10px] text-slate-500 mt-2">مكاسب نقاط الذكاء المكتسبة</div>
                        </div>
                    </div>
                    
                    <div class="text-center pt-4 border-t border-slate-800">
                        <p class="text-slate-400 text-sm mb-6">هل أنت مستعد لكسر حدود ذكائك الحالي واكتساب المزيد من نقاط الـ INT؟</p>
                        <button onclick="window.location.href='dungeons.html'" class="px-10 py-4 bg-[var(--sys-purple)]/10 border border-[var(--sys-purple)] text-[var(--sys-purple)] font-black uppercase tracking-[0.2em] hover:bg-[var(--sys-purple)] hover:text-white transition-all duration-300 rounded shadow-[0_0_15px_rgba(157,78,221,0.2)]">
                            ENTER DUNGEONS ⚔️
                        </button>
                    </div>
                `;
            }
        };

        // ==========================================
        // INITIALIZATION
        // ==========================================
        
            
            // تحديث حي عند تغير البيانات في صفحات أخرى
            window.addEventListener('storage', (e) => {
                if (e.key === 'monarch_system_data' || e.key === 'sovereign_system_logs') {
                    PlayerState.init();
                    BrainStats.render();
                }
            });
            // تهيئة الحالة والواجهة
            PlayerState.init();
    </script>
</body>
</html>
